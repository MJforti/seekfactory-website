<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <style>
      .sf-brand { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 42px; letter-spacing: 1px; }
      .sf-subtext { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; fill: #60A5FA; font-size: 15px; letter-spacing: 4.5px; }
      .sf-orange { fill: #E05638; }
    </style>
  </defs>
  <g transform="translate(10, 15)">
    <!-- 'S' Gear / Cogwheel Icon -->
    <g class="sf-orange" transform="translate(0, 10)">
      <!-- Gear Cog Wheel Top Circle -->
      <path d="M 28 5 C 16 5 8 13 8 25 C 8 32 12 37 18 41 L 34 49 C 42 53 48 60 48 70 C 48 84 36 94 20 94 C 10 94 2 87 0 78 L 12 74 C 13 80 18 84 22 84 C 28 84 34 79 34 72 C 34 66 30 62 24 58 L 10 50 C 2 45 -3 36 -3 24 C -3 8 10 -3 28 -3 Z" transform="translate(5, 5)"/>
      <!-- Small gear teeth details -->
      <circle cx="28" cy="18" r="4" fill="#090B0E" />
      <circle cx="20" cy="74" r="4" fill="#090B0E" />
    </g>

    <!-- 'F' Pipe Wrench Tool Icon -->
    <g class="sf-orange" transform="translate(65, 10)">
      <rect x="0" y="5" width="35" height="12" rx="3" />
      <rect x="0" y="24" width="28" height="10" rx="2" />
      <rect x="0" y="5" width="10" height="90" rx="3" />
      <rect x="-3" y="88" width="16" height="8" rx="2" />
    </g>

    <!-- Text: SEEK FACTORY -->
    <text x="135" y="60" class="sf-brand">SEEK FACTORY</text>
    
    <!-- Text: GREEN FACTORIES WORLDWIDE -->
    <text x="137" y="90" class="sf-subtext">GREEN FACTORIES WORLDWIDE</text>
  </g>
</svg>
